<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Vivid Senses Parteneri</title>
<meta name="robots" content="noindex,nofollow">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&family=Playfair+Display:wght@500;600&display=swap">

<style>
:root{color-scheme:light}html,body{margin:0}[hidden]{display:none!important}img{max-width:100%}

/* Layout: o bară de brand + file (tabs); fiecare filă e un ecran de lucru dens, cu sumarul sus și detaliul dedesubt. */
:root{
  --bg:#f5f4f1; --surface:#ffffff; --surface2:#efede8; --line:#dcd8cf; --fg:#1b1916; --muted:#6f685d;
  --gold:#94732f; --gold-soft:rgba(148,115,47,.12); --on-gold:#ffffff;
  --good:#2f7a4c; --warn:#a86a10; --bad:#b4413a; --good-bg:rgba(47,122,76,.12); --warn-bg:rgba(168,106,16,.12); --bad-bg:rgba(180,65,58,.12);
  --display:"Playfair Display",Georgia,"Times New Roman",serif; --body:"DM Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e0d0c; --surface:#171614; --surface2:#1f1d1a; --line:#2e2b26; --fg:#ece6da; --muted:#9b9387;
  --gold:#c9a85f; --gold-soft:rgba(201,168,95,.13); --on-gold:#14120f;
  --good:#71c08d; --warn:#e0ad4f; --bad:#e3746a; --good-bg:rgba(113,192,141,.13); --warn-bg:rgba(224,173,79,.13); --bad-bg:rgba(227,116,106,.14);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e0d0c; --surface:#171614; --surface2:#1f1d1a; --line:#2e2b26; --fg:#ece6da; --muted:#9b9387;
  --gold:#c9a85f; --gold-soft:rgba(201,168,95,.13); --on-gold:#14120f;
  --good:#71c08d; --warn:#e0ad4f; --bad:#e3746a; --good-bg:rgba(113,192,141,.13); --warn-bg:rgba(224,173,79,.13); --bad-bg:rgba(227,116,106,.14);
  color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:14.5px;line-height:1.5;font-variant-numeric:tabular-nums}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--side)}
/* Shell: meniu lateral negru-auriu (aceeași identitate în ambele teme) + bară de sus cu căutare și „Nou” */
:root{--side:#0e0d0c;--side2:#1a1815;--side-line:#2a2722;--side-fg:#e9e2d4;--side-mut:#8e877b;--side-gold:#c9a85f}
.app{display:flex;min-height:100vh}
.side{width:236px;flex-shrink:0;background:var(--side);color:var(--side-fg);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;padding:max(18px,env(safe-area-inset-top,0px)) 14px 16px max(14px,env(safe-area-inset-left,0px));z-index:15}
.logo{display:flex;align-items:center;gap:10px;padding:4px 6px 18px;border-bottom:1px solid var(--side-line);margin-bottom:12px}
.logo .mk{width:34px;height:34px;border-radius:50%;border:1px solid var(--side-gold);display:grid;place-items:center;font-family:var(--display);color:var(--side-gold);font-size:15px;font-style:italic}
.logo .tx{font-family:var(--display);font-size:17px;line-height:1.1}
.logo .tx small{display:block;font-family:var(--body);font-size:10.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--side-gold);margin-top:3px}
.sgrp{font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--side-mut);padding:14px 10px 6px}
.side button.nv{all:unset;box-sizing:border-box;width:100%;cursor:pointer;display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;font-size:13.5px;color:var(--side-fg);opacity:.82}
.side button.nv svg{width:17px;height:17px;flex-shrink:0;stroke:currentColor;fill:none;stroke-width:1.6}
.side button.nv:hover{background:var(--side2);opacity:1}
.side button.nv[aria-current="page"]{background:var(--side2);opacity:1;color:var(--side-gold);box-shadow:inset 2px 0 0 var(--side-gold)}
.side button.nv:focus-visible{outline:2px solid var(--side-gold);outline-offset:-2px}
.side .bdg{margin-left:auto;font-size:11px;padding:1px 7px;border-radius:999px;background:var(--side2);color:var(--side-mut)}
.side .bdg.hot{background:#b4413a;color:#fff}
.pres{margin-top:auto;padding:10px 8px 10px;border-top:1px solid var(--side-line);font-size:12.5px;color:var(--side-mut)}
.pres .ph{font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;margin-bottom:6px}
.pres .pu{display:flex;align-items:center;gap:8px;padding:3px 0}
.pres .pu b{font-weight:500;color:var(--side-fg)}
.pres .pu span{margin-left:auto;font-size:11.5px}
.pres .dot{width:8px;height:8px;border-radius:50%;background:#5a554c;flex-shrink:0}
.pres .dot.on{background:#4caf6a;box-shadow:0 0 0 3px rgba(76,175,106,.18)}
.pres:empty{display:none}
.who{display:flex;gap:9px;align-items:center;padding:12px 8px 0;border-top:1px solid var(--side-line);font-size:12.5px;color:var(--side-mut)}
.who img{width:28px;height:28px;border-radius:50%}
.who b{display:block;color:var(--side-fg);font-weight:500}
.mainc{flex:1;min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding-block:11px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
.top .tt{font-family:var(--display);font-size:21px;white-space:nowrap}
.srch{margin-left:auto;position:relative;width:min(320px,40vw)}
.srch input{padding-left:32px;background:var(--surface2);border-color:transparent}
.srch svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:15px;height:15px;stroke:var(--muted);fill:none;stroke-width:1.8}
.ham{display:none}
.sback{display:none}
main{width:100%;max-width:1280px;margin:0 auto;padding-block:22px 60px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:20px}
#main h1{display:none}
@media (max-width:860px){
  .side{position:fixed;left:0;top:0;transform:translateX(-105%);transition:transform .22s ease}
  .side.open{transform:none}
  .sback.open{display:block;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:14}
  .ham{display:inline-flex}
  .srch{width:auto;flex:1}
  #tt{font-size:18px}
  main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.st{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:13px 15px;display:flex;flex-direction:column;gap:2px;cursor:default}
.st.click{cursor:pointer}.st.click:hover,.st.on{border-color:var(--gold)}
.st .l{font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.st .v{font-size:24px;font-weight:500}
.st .v.g{color:var(--gold)}
.fbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.fbar select{width:auto;min-width:150px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-left:auto}
.seg button{all:unset;cursor:pointer;padding:7px 13px;font-size:13px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--gold-soft);color:var(--gold);font-weight:600}
.seg button:focus-visible{outline:2px solid var(--gold);outline-offset:-2px}
tr.clk{cursor:pointer}
.cname b{display:block}.cname span{font-size:12px;color:var(--muted)}
.tl{display:flex;flex-direction:column;gap:0;border-left:1px solid var(--line);margin-left:6px}
.tl .ti{position:relative;padding:0 0 12px 16px;font-size:13px}
.tl .ti::before{content:"";position:absolute;left:-5px;top:5px;width:9px;height:9px;border-radius:50%;background:var(--surface);border:2px solid var(--gold)}
.tl .ti.s::before{border-color:var(--warn)}.tl .ti.v::before{border-color:var(--good)}
.tl .ti .d{font-size:11.5px;color:var(--muted)}
.dhead{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.dhead .t{font-family:var(--display);font-size:22px;line-height:1.15}
.stg{display:flex;gap:6px;flex-wrap:wrap}
.stg button{all:unset;cursor:pointer;font-size:12px;padding:4px 10px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.stg button[aria-pressed="true"]{border-color:var(--gold);background:var(--gold-soft);color:var(--gold);font-weight:600}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-size:11px;font-family:var(--body)}
.leg{display:flex;gap:14px;font-size:12px;color:var(--muted)}
.leg i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
h1{font-family:var(--display);font-weight:500;font-size:26px;margin:0;text-wrap:balance}
h2{font-family:var(--display);font-weight:500;font-size:19px;margin:0 0 4px;text-wrap:balance}
.sub{color:var(--muted);margin:2px 0 0;max-width:70ch}
.eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold)}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.between{justify-content:space-between}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px;min-width:0}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:13px 15px;display:flex;flex-direction:column;gap:2px}
.kpi .l{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.kpi .v{font-size:22px;font-weight:500}
.kpi .n{font-size:12px;color:var(--muted)}
.kpi.hl .v{color:var(--gold)}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap;vertical-align:middle}
th{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:500;background:var(--surface2);position:sticky;top:0}
td.num,th.num{text-align:right}
tr:last-child td{border-bottom:0}
tbody tr:hover{background:var(--gold-soft)}
td.wrapc{white-space:normal;min-width:180px}
.pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;background:var(--surface2);color:var(--muted)}
.pill.good{background:var(--good-bg);color:var(--good)} .pill.warn{background:var(--warn-bg);color:var(--warn)} .pill.bad{background:var(--bad-bg);color:var(--bad)} .pill.gold{background:var(--gold-soft);color:var(--gold)}
.pos{color:var(--good)} .neg{color:var(--bad)} .mut{color:var(--muted)}
button.b{font:inherit;font-size:13.5px;cursor:pointer;border-radius:8px;padding:8px 14px;border:1px solid var(--line);background:var(--surface);color:var(--fg)}
button.b:hover{border-color:var(--gold)}
button.b.pri{background:var(--gold);border-color:var(--gold);color:var(--on-gold);font-weight:600}
button.b.sm{padding:4px 10px;font-size:12.5px}
button.b.danger{color:var(--bad)}
button.b:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--gold);outline-offset:1px}
button.b[disabled]{opacity:.5;cursor:default}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);min-width:0}
input,select,textarea{font:inherit;font-size:14px;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:7px 9px;min-width:0;width:100%}
textarea{min-height:64px;resize:vertical}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.empty{padding:28px;text-align:center;color:var(--muted)}
.todo{display:flex;flex-direction:column;gap:8px}
.todo .it{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:10px 12px;border:1px solid var(--line);border-radius:8px;flex-wrap:wrap}
.pipe{display:grid;grid-template-columns:repeat(6,minmax(210px,1fr));gap:10px;overflow-x:auto;padding-bottom:6px}
.col{background:var(--surface2);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:8px;min-height:120px}
.col h3{margin:0;font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:500;display:flex;justify-content:space-between}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px;cursor:pointer;display:flex;flex-direction:column;gap:3px}
.card:hover{border-color:var(--gold)}
.card .t{font-weight:600}
.card .m{font-size:12px;color:var(--muted)}
.bar{height:6px;border-radius:3px;background:var(--surface2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--gold)}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.42);z-index:20;display:flex;justify-content:flex-end}
.modal{background:var(--surface);border-left:1px solid var(--line);width:min(640px,100%);height:100%;overflow-y:auto;padding:max(20px,env(safe-area-inset-top,0px)) max(22px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) 22px;display:flex;flex-direction:column;gap:14px}
.modal .acts{position:sticky;bottom:calc(-20px - env(safe-area-inset-bottom,0px));background:var(--surface);padding:12px 0 calc(4px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);margin-top:auto}
@media (prefers-reduced-motion:no-preference){.modal{animation:sin .22s cubic-bezier(.16,1,.3,1)}@keyframes sin{from{transform:translateX(40px);opacity:.4}to{transform:none;opacity:1}}}
.lines{display:flex;flex-direction:column;gap:8px}
.line{display:grid;grid-template-columns:minmax(0,3fr) 80px 110px 34px;gap:8px;align-items:end}
@media (max-width:560px){.line{grid-template-columns:minmax(0,1fr) 70px 90px 30px}}
.calc{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;background:var(--surface2);border-radius:8px;padding:12px}
.calc div{display:flex;flex-direction:column}
.calc .l{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em}
.note{font-size:12.5px;color:var(--muted)}
.notes{display:flex;flex-direction:column;gap:6px;max-height:240px;overflow-y:auto}
.notes div{border-left:2px solid var(--gold);padding:2px 10px;font-size:13px}
.toast{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 14px;border-radius:8px;z-index:30;font-size:13.5px}
.chk{display:flex;gap:6px;flex-wrap:wrap}
.chk label{display:flex;gap:6px;align-items:center;font-size:13px;color:var(--fg);border:1px solid var(--line);border-radius:7px;padding:5px 9px}
.chk input{width:auto}
.fu{display:flex;gap:6px;flex-wrap:wrap}
@media (prefers-reduced-motion:no-preference){.card,button.b{transition:border-color .15s}}

/* Login */
body.locked .app{display:none}
#login{position:fixed;inset:0;z-index:40;background:#0e0d0c;display:grid;place-items:center;padding:24px}
#login .box{width:min(380px,100%);color:#e9e2d4;display:flex;flex-direction:column;gap:14px}
#login .mk{width:56px;height:56px;border-radius:50%;border:1px solid #c9a85f;display:grid;place-items:center;font-family:var(--display);font-style:italic;color:#c9a85f;font-size:22px}
#login h1{display:block;font-family:var(--display);font-weight:500;font-size:30px;margin:6px 0 0;color:#f2ece1}
#login p{margin:0;color:#8e877b;font-size:13.5px}
#login label{display:flex;flex-direction:column;gap:5px;font-size:12px;color:#8e877b;letter-spacing:.06em;text-transform:uppercase}
#login input{background:#1a1815;border:1px solid #2e2b26;color:#f2ece1;padding:11px 12px;font-size:15px;border-radius:8px}
#login input:focus-visible{outline:2px solid #c9a85f;outline-offset:1px}
#login button.go{font:inherit;font-weight:600;background:#c9a85f;color:#14120f;border:0;border-radius:8px;padding:12px;cursor:pointer;font-size:15px}
#login button.go[disabled]{opacity:.6}
#login .lnk{all:unset;cursor:pointer;color:#c9a85f;font-size:13px;align-self:flex-start}
.lmsg{min-height:18px;font-size:13px;color:#e3746a}.lmsg.ok{color:#71c08d}
/* Decont tipărit */
#print{display:none}
@media print{
  @page{size:A4;margin:16mm}
  body{background:#fff!important;color:#000!important}
  body *{visibility:hidden}
  #print,#print *{visibility:visible}
  #print{display:block;position:absolute;inset:0;font-family:var(--body);font-size:11pt;color:#000}
  #print .ph{display:flex;justify-content:space-between;border-bottom:1.5pt solid #000;padding-bottom:8pt;margin-bottom:12pt}
  #print .pt{font-family:var(--display);font-size:20pt}
  #print table{width:100%;border-collapse:collapse;font-size:9.5pt}
  #print th,#print td{border-bottom:.5pt solid #999;padding:4pt;text-align:left;white-space:normal;background:none;color:#000;position:static}
  #print td.num{text-align:right}
  #print tfoot td{font-weight:700;border-top:1pt solid #000}
  #print .sig{display:flex;justify-content:space-between;margin-top:36pt}
  #print .sig div{width:45%;border-top:.5pt solid #000;padding-top:4pt}
}
@media (max-width:860px){#exps{display:none!important}}
/* ---- Telefon ---- */
@media (max-width:860px){
  .top{flex-wrap:wrap;row-gap:10px}
  #tt{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .srch{order:5;flex:1 1 100%;width:100%;margin-left:0}
  main > .row.between > button.b.pri, main > .row.between > .row > button.b.pri{display:none}
  main > .row.between > div:first-child{flex:1 1 100%}
}
@media (max-width:640px){
  main .tw{border:0;background:none;overflow:visible;border-radius:0}
  main .tw table, main .tw tbody, main .tw tr, main .tw td{display:block;width:100%}
  main .tw thead{display:none}
  main .tw tbody tr{background:var(--surface);border:1px solid var(--line);border-radius:10px;margin-bottom:10px;padding:4px 14px}
  main .tw td{display:flex;justify-content:space-between;align-items:center;gap:14px;border-bottom:1px solid var(--line);padding:9px 0;white-space:normal;text-align:right;min-width:0}
  main .tw td:last-child{border-bottom:0}
  main .tw td:empty{display:none}
  main .tw td::before{content:attr(data-label);color:var(--muted);font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;text-align:left;flex-shrink:0;max-width:42%}
  main .tw td:first-child{font-weight:600;font-size:15px;text-align:left;justify-content:flex-start}
  main .tw td:first-child::before{display:none}
  main .tw td > .row{justify-content:flex-end}
  .fbar select{flex:1 1 140px;min-width:0}
}

</style>
</head>
<body class="locked">
<div id="login" hidden>
  <form class="box" id="lf" novalidate>
    <div class="mk">VS</div>
    <h1>Vivid Senses Parteneri</h1>
    <p>Intră cu emailul și parola primite de la Alex.</p>
    <label>Email<input id="l-email" type="email" autocomplete="username" required></label>
    <label>Parolă<input id="l-pass" type="password" autocomplete="current-password" required></label>
    <div class="lmsg" id="l-msg" role="status"></div>
    <button class="go" id="l-btn" type="submit">Intră</button>
    <button class="lnk" id="l-reset" type="button">Am uitat parola</button>
  </form>
  <form class="box" id="pwf" novalidate hidden>
    <div class="mk">VS</div>
